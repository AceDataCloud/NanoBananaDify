identity:
  name: nano_banana_edit_image
  author: acedatacloud
  label:
    en_US: Nano Banana Edit Image
    zh_Hans: Nano Banana 编辑图片
description:
  human:
    en_US: Edit image(s) with Ace Data Cloud Nano Banana Images API.
    zh_Hans: 通过 Ace Data Cloud Nano Banana Images API 编辑图片。
  llm: Edit image(s) with a prompt and image_urls via Ace Data Cloud Nano Banana Images
    API. Returns a task ID; use the task retrieval tool to obtain completed media.
    Never repeat a pending submission.
parameters:
- name: prompt
  label:
    en_US: Prompt
    zh_Hans: 提示词
  type: string
  required: true
  form: llm
  human_description:
    en_US: Text prompt describing the edit.
    zh_Hans: 描述希望生成或编辑的内容。
  llm_description: Text prompt describing the edit.
- name: model
  label:
    en_US: Model
    zh_Hans: 模型
  type: select
  required: false
  form: form
  human_description:
    en_US: Select the model. Available models, access and pricing are shown in the
      Ace Data Cloud console.
    zh_Hans: 选择要调用的模型。模型权限和价格以 Ace Data Cloud 控制台为准。
  llm_description: Select the model. Available models, access and pricing are shown
    in the Ace Data Cloud console.
  default: nano-banana-2-lite
  options:
  - value: nano-banana
    label:
      en_US: nano-banana
      zh_Hans: nano-banana
  - value: nano-banana-2-lite
    label:
      en_US: nano-banana-2-lite
      zh_Hans: nano-banana-2-lite
  - value: nano-banana-2
    label:
      en_US: nano-banana-2
      zh_Hans: nano-banana-2
  - value: nano-banana-pro
    label:
      en_US: nano-banana-pro
      zh_Hans: nano-banana-pro
- name: aspect_ratio
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  type: select
  required: false
  form: form
  human_description:
    en_US: Aspect ratio for editing. Default is 1:1.
    zh_Hans: 生成图片的画面比例。
  llm_description: Aspect ratio for editing. Default is 1:1.
  default: '1:1'
  options:
  - value: '1:1'
    label:
      en_US: '1:1'
      zh_Hans: '1:1'
  - value: '3:2'
    label:
      en_US: '3:2'
      zh_Hans: '3:2'
  - value: '2:3'
    label:
      en_US: '2:3'
      zh_Hans: '2:3'
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
  - value: '4:3'
    label:
      en_US: '4:3'
      zh_Hans: '4:3'
  - value: '3:4'
    label:
      en_US: '3:4'
      zh_Hans: '3:4'
- name: resolution
  label:
    en_US: Resolution
    zh_Hans: 分辨率
  type: select
  required: false
  form: form
  human_description:
    en_US: Optional. Only works when model is nano-banana-pro.
    zh_Hans: 输出分辨率；可用选项取决于所选模型。
  llm_description: Optional. Only works when model is nano-banana-pro.
  default: 1K
  options:
  - value: 1K
    label:
      en_US: 1K
      zh_Hans: 1K
  - value: 2K
    label:
      en_US: 2K
      zh_Hans: 2K
  - value: 4K
    label:
      en_US: 4K
      zh_Hans: 4K
- name: count
  label:
    en_US: Image count
    zh_Hans: 图片数量
  type: number
  required: false
  form: form
  human_description:
    en_US: Number of images to generate; each image is billed at the current service
      rate.
    zh_Hans: 一次生成的图片数量；每张图片按当前服务价格计费。
  llm_description: Number of images to generate; each image is billed at the current
    service rate.
  default: 1
- name: image_urls
  label:
    en_US: Image URLs
    zh_Hans: 图片链接
  type: string
  required: true
  form: llm
  human_description:
    en_US: Public HTTPS image URLs, one per line or a JSON array. Only submit images
      you may use.
    zh_Hans: 公开 HTTPS 图片链接，每行一个或使用 JSON 数组。请仅提交有权使用的图片。
  llm_description: Public HTTPS image URLs, one per line or a JSON array. Only submit
    images you may use.
output_schema:
  type: object
  properties:
    status:
      type: string
    task_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    result:
      type: object
    success:
      type: boolean
    trace_id:
      type: string
    data: {}
extra:
  python:
    source: tools/nano_banana_edit.py
