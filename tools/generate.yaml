identity:
  name: nano_banana_generate
  author: acedatacloud
  label:
    en_US: Generate image
description:
  human:
    en_US: Generate image through Nano Banana by Ace Data Cloud.
  llm: Generate image through Nano Banana by Ace Data Cloud. Generation returns a
    task ID; use Retrieve or wait for task for the final result.
parameters:
- name: prompt
  label:
    en_US: Prompt
  type: string
  required: true
  form: llm
  human_description:
    en_US: Prompt
  llm_description: Prompt
- name: model
  label:
    en_US: Model
  type: select
  required: false
  form: form
  human_description:
    en_US: Model
  llm_description: Model
  default: nano-banana-2-lite
  options:
  - value: nano-banana
    label:
      en_US: nano-banana
  - value: nano-banana-2-lite
    label:
      en_US: nano-banana-2-lite
  - value: nano-banana-2
    label:
      en_US: nano-banana-2
  - value: nano-banana-pro
    label:
      en_US: nano-banana-pro
- name: aspect_ratio
  label:
    en_US: Aspect ratio
  type: select
  required: false
  form: form
  human_description:
    en_US: Aspect ratio
  llm_description: Aspect ratio
  default: '1:1'
  options:
  - value: '1:1'
    label:
      en_US: '1:1'
  - value: '3:2'
    label:
      en_US: '3:2'
  - value: '2:3'
    label:
      en_US: '2:3'
  - value: '16:9'
    label:
      en_US: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
  - value: '4:3'
    label:
      en_US: '4:3'
  - value: '3:4'
    label:
      en_US: '3:4'
- name: resolution
  label:
    en_US: Resolution
  type: select
  required: false
  form: form
  human_description:
    en_US: Resolution
  llm_description: Resolution
  default: 1K
  options:
  - value: 1K
    label:
      en_US: 1K
  - value: 2K
    label:
      en_US: 2K
  - value: 4K
    label:
      en_US: 4K
- name: count
  label:
    en_US: Image count
  type: number
  required: false
  form: form
  human_description:
    en_US: Image count
  llm_description: Image count
  default: 1
output_schema:
  type: object
  properties:
    status:
      type: string
    task_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    result:
      type: object
extra:
  python:
    source: tools/generate.py
